name = "c13_public"
version = "0.1.0"
defaultTargets = ["C13Global"]
moreLeanArgs = ["--trust=0", "-j", "1", "-M", "3072"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "0ed37c9258f123a2c76a2175596f75c2bd50f941"

[[lean_lib]]
name = "C13"
roots = ["C13.Checker"]

[[lean_lib]]
name = "C13Arc"
roots = ["C13Arc.Certificate"]

[[lean_lib]]
name = "C13Covering"
roots = ["C13Covering.CatalogReduction"]

[[lean_lib]]
name = "C13Enumeration"
roots = ["C13Enumeration.Canonical.Atlas"]

[[lean_lib]]
name = "C13Global"
roots = ["C13Global.Final", "C13Global.Statistics", "C13Global.AuditFinal"]

[[lean_lib]]
name = "C13Raw"
roots = ["C13Raw.BlockSupport"]

[[lean_lib]]
name = "C13RawStarRecovery"
roots = ["C13RawStarRecovery.CenterDomains"]
